<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IVANA STORE | متجر إيفانا</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">IVANA STORE</div>
        <div class="cart-icon-btn" onclick="toggleCart()">
            🛒 السلة (<span id="cart-count">0</span>)
        </div>
    </header>

    <section class="hero">
        <h1>مرحباً بكم في IVANA STORE</h1>
        <p>منتجات العناية والجمال الطبيعية بأعلى جودة</p>
    </section>

    <main class="container">
        <h2>منتجاتنا المميزة</h2>
        <div id="products-grid" class="products-grid"></div>
    </main>

    <!-- نافذة السلة والطلب -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleCart()">&times;</span>
            <h2>سلة الشراء</h2>
            <div id="cart-items"></div>
            <div class="cart-summary">
                <strong>المجموع الكلي: </strong><span id="cart-total">0 شيكل</span>
            </div>

            <hr>

            <h3>معلومات إتمام الطلب</h3>
            <form onsubmit="submitOrder(event)">
                <input type="text" id="customer-name" placeholder="الاسم الكامل" required>
                <input type="tel" id="customer-phone" placeholder="رقم الهاتف" required>
                <input type="text" id="customer-address" placeholder="العنوان التفصيلي / المدينة والشارع" required>
                <textarea id="customer-notes" placeholder="ملاحظات إضافية (اختياري)"></textarea>
                <button type="submit" class="btn-checkout">تأكيد وإرسال الطلب عبر الواتساب</button>
            </form>
        </div>
    </div>

    <script src="products.js"></script>
    <script src="script.js"></script>
</body>
</html>
